services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booklane
      POSTGRES_PASSWORD: booklane
      POSTGRES_DB: booklane
    ports:
      - "5432:5432"
    volumes:
      - booklane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklane -d booklane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booklane_pg:
